name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── Import Developer ID cert ─────────────────────────────────────────────
      - name: Import certificate
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      # ── Build & Archive ───────────────────────────────────────────────────────
      - name: Archive
        run: |
          xcodebuild archive \
            -project apps/biblo/Biblo.xcodeproj \
            -scheme Biblo \
            -configuration Release \
            -archivePath build/Biblo.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain"

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Biblo.xcarchive \
            -exportOptionsPlist apps/biblo/ExportOptions.plist \
            -exportPath build/export

      # ── Notarize ─────────────────────────────────────────────────────────────
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcrun notarytool submit build/export/Biblo.app \
            --apple-id "$APPLE_ID" \
            --password "$NOTARY_APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

      - name: Staple
        run: xcrun stapler staple build/export/Biblo.app

      # ── Package DMG ──────────────────────────────────────────────────────────
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          create-dmg \
            --volname "Biblo" \
            --volicon "apps/biblo/Assets.xcassets/AppIcon.appiconset/icon_512x512.png" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Biblo.app" 200 185 \
            --hide-extension "Biblo.app" \
            --app-drop-link 600 185 \
            "build/Biblo-${VERSION}.dmg" \
            "build/export/Biblo.app"

      # ── Publish GitHub Release ────────────────────────────────────────────────
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Biblo $GITHUB_REF_NAME" \
            --generate-notes \
            "build/Biblo-${VERSION}.dmg"

      # ── Update appcast ────────────────────────────────────────────────────────
      - name: Update appcast.xml
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="build/Biblo-${VERSION}.dmg"
          SIZE=$(stat -f%z "$DMG")
          DATE=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")
          # Sign with Sparkle's sign_update tool (must be in PATH from Sparkle SPM)
          # SIGNATURE=$(./sparkle/bin/sign_update "$DMG" "$SPARKLE_ED_KEY")
          SIGNATURE="REPLACE_WITH_SPARKLE_SIGNATURE"

          ITEM="    <item>
              <title>Version ${VERSION}</title>
              <sparkle:version>${VERSION}</sparkle:version>
              <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
              <pubDate>${DATE}</pubDate>
              <enclosure
                url=\"https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/Biblo-${VERSION}.dmg\"
                sparkle:edSignature=\"${SIGNATURE}\"
                length=\"${SIZE}\"
                type=\"application/octet-stream\"/>
            </item>"

          # Insert after <language> line
          python3 - <<'PY'
          import re, sys
          item = open('/dev/stdin').read() if False else """${ITEM}"""
          xml = open('releases/appcast.xml').read()
          xml = xml.replace('    <!-- Releases will be added here by CI on every tagged push -->', item + '\n    <!-- Releases will be added here by CI on every tagged push -->')
          open('releases/appcast.xml', 'w').write(xml)
          PY

          cp releases/appcast.xml apps/web/public/appcast.xml

      - name: Commit updated appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/appcast.xml apps/web/public/appcast.xml
          git commit -m "chore: update appcast for $GITHUB_REF_NAME" || true
          git push origin HEAD:main
