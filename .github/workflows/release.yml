name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── Import Developer ID cert ─────────────────────────────────────────────
      - name: Import certificate
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::No signing certificate — building unsigned"
            echo "UNSIGNED=true" >> $GITHUB_ENV
          else
            echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
            security create-keychain -p "" build.keychain
            security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
            security list-keychains -s build.keychain
            security set-keychain-settings -t 3600 -l build.keychain
            security unlock-keychain -p "" build.keychain
            security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          fi

      # ── Build & Archive ───────────────────────────────────────────────────────
      - name: Archive (signed)
        if: env.UNSIGNED != 'true'
        run: |
          xcodebuild archive \
            -project apps/biblo/Biblo.xcodeproj \
            -scheme Biblo \
            -configuration Release \
            -archivePath build/Biblo.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain"

      - name: Archive (unsigned)
        if: env.UNSIGNED == 'true'
        run: |
          xcodebuild archive \
            -project apps/biblo/Biblo.xcodeproj \
            -scheme Biblo \
            -configuration Release \
            -archivePath build/Biblo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export
        run: |
          mkdir -p build/export
          cp -R build/Biblo.xcarchive/Products/Applications/Biblo.app build/export/Biblo.app

      # ── Notarize (only if signed) ───────────────────────────────────────────
      - name: Notarize
        if: env.UNSIGNED != 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcrun notarytool submit build/export/Biblo.app \
            --apple-id "$APPLE_ID" \
            --password "$NOTARY_APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

      - name: Staple
        if: env.UNSIGNED != 'true'
        run: xcrun stapler staple build/export/Biblo.app

      # ── Package DMG ──────────────────────────────────────────────────────────
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          create-dmg \
            --volname "Biblo" \
            --volicon "apps/biblo/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Biblo.app" 200 185 \
            --hide-extension "Biblo.app" \
            --app-drop-link 600 185 \
            "build/Biblo-${VERSION}.dmg" \
            "build/export/Biblo.app"

      # ── Smoke test ───────────────────────────────────────────────────────────
      - name: Smoke test DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          hdiutil attach "build/Biblo-${VERSION}.dmg" -nobrowse -quiet
          MOUNT=$(hdiutil info | grep "Biblo" | awk '{print $NF}')
          test -d "${MOUNT}/Biblo.app" || { echo "Biblo.app not found"; exit 1; }
          test -x "${MOUNT}/Biblo.app/Contents/MacOS/Biblo" || { echo "Binary not executable"; exit 1; }
          echo "Smoke test passed"
          hdiutil detach "${MOUNT}" -quiet

      # ── Publish GitHub Release ────────────────────────────────────────────────
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Biblo $GITHUB_REF_NAME" \
            --generate-notes \
            "build/Biblo-${VERSION}.dmg"
