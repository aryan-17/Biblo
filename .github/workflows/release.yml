name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Override bump type (leave empty for auto-detect from commits)"
        required: false
        type: choice
        options:
          - ""
          - patch
          - minor
          - major

jobs:
  # ── Version ──────────────────────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "current=${CURRENT}" >> $GITHUB_OUTPUT

          MAJOR=$(echo "$CURRENT" | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | sed 's/v//' | cut -d. -f3)

          # Manual override or auto-detect from conventional commits
          BUMP="${{ inputs.bump }}"
          if [ -z "$BUMP" ]; then
            LOGS=$(git log "${CURRENT}..HEAD" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

            if echo "$LOGS" | grep -qE '^[a-z]+(\(.+\))?!:'; then
              BUMP="major"
            elif echo "$LOGS" | grep -qE '^feat(\(.+\))?:'; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW="v${MAJOR}.${MINOR}.${PATCH}"
          echo "bump=${BUMP}" >> $GITHUB_OUTPUT
          echo "version=${NEW}" >> $GITHUB_OUTPUT
          echo "Bump: ${BUMP} | ${CURRENT} → ${NEW}"

      - name: Create and push tag
        run: |
          git tag "${{ steps.bump.outputs.version }}"
          git push origin "${{ steps.bump.outputs.version }}"

  # ── Build & Release ──────────────────────────────────────────────────────────
  build-and-release:
    needs: version
    runs-on: macos-15
    permissions:
      contents: write

    env:
      VERSION_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      # ── Import Developer ID cert ─────────────────────────────────────────────
      - name: Import certificate
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::No signing certificate — building unsigned"
            echo "UNSIGNED=true" >> $GITHUB_ENV
          else
            echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
            security create-keychain -p "" build.keychain
            security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
            security list-keychains -s build.keychain
            security set-keychain-settings -t 3600 -l build.keychain
            security unlock-keychain -p "" build.keychain
            security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          fi

      # ── Build & Archive ───────────────────────────────────────────────────────
      - name: Archive (signed)
        if: env.UNSIGNED != 'true'
        run: |
          xcodebuild archive \
            -project apps/biblo/Biblo.xcodeproj \
            -scheme Biblo \
            -configuration Release \
            -archivePath build/Biblo.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain"

      - name: Archive (unsigned)
        if: env.UNSIGNED == 'true'
        run: |
          xcodebuild archive \
            -project apps/biblo/Biblo.xcodeproj \
            -scheme Biblo \
            -configuration Release \
            -archivePath build/Biblo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export
        run: |
          mkdir -p build/export
          cp -R build/Biblo.xcarchive/Products/Applications/Biblo.app build/export/Biblo.app

      # ── Notarize (only if signed) ───────────────────────────────────────────
      - name: Notarize
        if: env.UNSIGNED != 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcrun notarytool submit build/export/Biblo.app \
            --apple-id "$APPLE_ID" \
            --password "$NOTARY_APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

      - name: Staple
        if: env.UNSIGNED != 'true'
        run: xcrun stapler staple build/export/Biblo.app

      # ── Package DMG ──────────────────────────────────────────────────────────
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          VERSION="${VERSION_TAG#v}"
          create-dmg \
            --volname "Biblo" \
            --volicon "apps/biblo/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Biblo.app" 200 185 \
            --hide-extension "Biblo.app" \
            --app-drop-link 600 185 \
            "build/Biblo-${VERSION}.dmg" \
            "build/export/Biblo.app"

      # ── Smoke test ───────────────────────────────────────────────────────────
      - name: Smoke test DMG
        run: |
          VERSION="${VERSION_TAG#v}"
          hdiutil attach "build/Biblo-${VERSION}.dmg" -nobrowse -quiet
          MOUNT=$(hdiutil info | grep "Biblo" | awk '{print $NF}')
          test -d "${MOUNT}/Biblo.app" || { echo "Biblo.app not found"; exit 1; }
          test -x "${MOUNT}/Biblo.app/Contents/MacOS/Biblo" || { echo "Binary not executable"; exit 1; }
          echo "Smoke test passed"
          hdiutil detach "${MOUNT}" -quiet

      # ── Publish GitHub Release ────────────────────────────────────────────────
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${VERSION_TAG#v}"
          gh release create "$VERSION_TAG" \
            --title "Biblo $VERSION_TAG" \
            --generate-notes \
            "build/Biblo-${VERSION}.dmg"
