name: Nightly

on:
  workflow_dispatch:

jobs:
  # ── Build app ────────────────────────────────────────────────────────────────
  build:
    name: Build & package
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project apps/biblo/Biblo.xcodeproj \
            -scheme Biblo \
            -configuration Release \
            -archivePath build/Biblo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract app
        run: |
          mkdir -p build/export
          cp -R build/Biblo.xcarchive/Products/Applications/Biblo.app build/export/Biblo.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Biblo" \
            --volicon "apps/biblo/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Biblo.app" 200 185 \
            --hide-extension "Biblo.app" \
            --app-drop-link 600 185 \
            "build/Biblo-nightly.dmg" \
            "build/export/Biblo.app"

      # ── Smoke test: mount DMG, verify app exists and binary runs ─────────────
      - name: Smoke test DMG
        run: |
          hdiutil attach build/Biblo-nightly.dmg -nobrowse -quiet
          MOUNT=$(hdiutil info | grep "Biblo" | awk '{print $NF}')
          test -d "${MOUNT}/Biblo.app" || { echo "Biblo.app not found in DMG"; exit 1; }
          test -x "${MOUNT}/Biblo.app/Contents/MacOS/Biblo" || { echo "Binary not executable"; exit 1; }
          echo "Smoke test passed"
          hdiutil detach "${MOUNT}" -quiet

      # ── Publish rolling nightly release ──────────────────────────────────────
      - name: Publish nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          gh release delete nightly --yes 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true
          gh release create nightly \
            --title "Nightly (${SHA})" \
            --notes "Built from \`${SHA}\` on \`main\`. Not a stable release." \
            "build/Biblo-nightly.dmg"
