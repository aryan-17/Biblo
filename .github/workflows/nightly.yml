name: Nightly

on:
  push:
    branches:
      - main

jobs:
  nightly:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── Build & Archive (unsigned) ────────────────────────────────────────────
      - name: Archive
        run: |
          xcodebuild archive \
            -project apps/biblo/Biblo.xcodeproj \
            -scheme Biblo \
            -configuration Release \
            -archivePath build/Biblo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract app
        run: |
          mkdir -p build/export
          cp -R build/Biblo.xcarchive/Products/Applications/Biblo.app build/export/Biblo.app

      # ── Package DMG ──────────────────────────────────────────────────────────
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Biblo" \
            --volicon "apps/biblo/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Biblo.app" 200 185 \
            --hide-extension "Biblo.app" \
            --app-drop-link 600 185 \
            "build/Biblo-nightly.dmg" \
            "build/export/Biblo.app"

      # ── Publish rolling nightly pre-release ───────────────────────────────────
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          gh release delete nightly --yes 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true
          gh release create nightly \
            --title "Nightly (${SHA})" \
            --notes "Built from \`${SHA}\` on \`main\`. Not a stable release." \
            --prerelease \
            "build/Biblo-nightly.dmg"
